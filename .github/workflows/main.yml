name: Build Flutter APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'

      - name: Unzip project code safely
        run: |
          unzip -o tele_link_shield.zip -d temp_project
          if [ -d "temp_project/tele_link_shield" ]; then
            mv temp_project/tele_link_shield/* .
            mv temp_project/tele_link_shield/.* . 2>/dev/null || true
          else
            mv temp_project/* .
            mv temp_project/.* . 2>/dev/null || true
          fi
          rm -rf temp_project tele_link_shield.zip

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk